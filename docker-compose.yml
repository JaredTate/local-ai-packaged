volumes:
  valkey-data:

services:
  # NOTE: Memgraph disabled — crashes with SIGSEGV on kernel 6.17.0 with native Docker
  # (worked before via Docker Desktop VM). Needs investigation — likely glibc/CPU instruction compat issue.
  # Re-enable when memgraph/memgraph image supports this kernel.
  #
  # memgraph:
  #   image: memgraph/memgraph-mage:latest
  #   container_name: memgraph
  #   restart: unless-stopped
  #   ports:
  #     - "7688:7687"
  #     - "7445:7444"
  #   environment:
  #     - MEMGRAPH_USER=${MEMGRAPH_USER:-memgraph}
  #     - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-memgraph}
  #   volumes:
  #     - ./memgraph/data:/var/lib/memgraph
  #     - ./memgraph/logs:/var/log/memgraph
  #
  # memgraph-lab:
  #   image: memgraph/lab:latest
  #   container_name: memgraph-lab
  #   restart: unless-stopped
  #   ports:
  #     - "3003:3000"
  #   depends_on:
  #     - memgraph
  #
  # memgraph-api:
  #   image: python:3.11-slim
  #   container_name: memgraph-api
  #   restart: unless-stopped
  #   ports:
  #     - "5001:5000"
  #   depends_on:
  #     - memgraph

  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning --requirepass LOCALONLYREDIS
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    expose:
      - 6379/tcp
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "LOCALONLYREDIS", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:8080"
    expose:
      - 8080/tcp
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
    shm_size: '1g'
    env_file:
      - .env
    volumes:
      - /dev/shm:/dev/shm
